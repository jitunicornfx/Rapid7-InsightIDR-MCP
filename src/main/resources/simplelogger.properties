# Keep all logging on stderr so stdout is reserved for the MCP JSON-RPC stream.
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true

# The MCP Kotlin SDK 0.15.0 logs three INFO lines for every tool registered ("Adding Tool", "Added
# Tool", "Notifying listeners on feature update") and two for every tool called ("Getting Tool", "Got
# Tool"): 440 of the 451 stderr lines of a stdio start, tools/list and one tools/call on 2026-10-13.
# The logger's whole name is "FeatureRegistry[Tool]", with no package, so only this exact key matches
# it. WARN still lets through the one ERROR message that logger has in 0.15.0. The server's own
# messages ("[insightidr-mcp] ...") go to stderr directly, not through slf4j: no level here affects them.
org.slf4j.simpleLogger.log.FeatureRegistry[Tool]=warn
